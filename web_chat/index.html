<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DIAL 图文问答</title>
  <link rel="stylesheet" href="/web-chat/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/chat" aria-label="DIAL 图文问答">
      <span class="brand-mark" aria-hidden="true">iS</span>
      <span>iSure</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <strong>DIAL 图文问答</strong>
    </a>

    <div class="connection" id="connectionStatus" role="status">
      <span class="status-dot"></span>
      <span id="connectionText">正在连接 Master</span>
      <span class="latency" id="connectionLatency"></span>
    </div>
  </header>

  <main class="workspace">
    <section class="input-pane" aria-labelledby="inputTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">视觉输入</p>
          <h1 id="inputTitle">选择图片</h1>
        </div>
        <button class="icon-button" id="clearImageButton" type="button"
                aria-label="移除图片" title="移除图片" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 10v7m4-7v7"/>
          </svg>
        </button>
      </div>

      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden>
        <button class="drop-zone" id="dropZone" type="button"
                aria-describedby="uploadHelp">
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21m8-3-3-3"/>
          </svg>
        </span>
        <strong>选择或拖入一张图片</strong>
        <span id="uploadHelp">PNG、JPG、WEBP、BMP，最大 20 MB</span>
      </button>

      <figure class="image-preview" id="imagePreview" hidden>
        <img id="previewImage" alt="待分析图片">
        <figcaption>
          <span id="imageName"></span>
          <span id="imageMeta"></span>
        </figcaption>
      </figure>

      <div class="prompt-block">
        <label for="promptInput">问题</label>
        <textarea id="promptInput" rows="5"
                  placeholder="请输入关于图片的问题"></textarea>
        <div class="prompt-footer">
          <div class="suggestions" aria-label="常用问题">
            <button type="button" data-prompt="请详细描述这张图片。">描述图片</button>
            <button type="button" data-prompt="图片中有哪些主要物体？">识别物体</button>
            <button type="button" data-prompt="请分析图片中的异常情况或安全风险。">安全分析</button>
          </div>
          <span class="character-count"><span id="characterCount">0</span>/1000</span>
        </div>
      </div>

      <div class="actions">
        <button class="primary-button" id="askButton" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
          </svg>
          <span>开始分析</span>
        </button>
        <button class="secondary-button" id="stopButton" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
          <span>停止接收</span>
        </button>
      </div>
    </section>

    <section class="answer-pane" aria-labelledby="answerTitle">
      <div class="section-heading answer-heading">
        <div>
          <p class="eyebrow">DIAL RESPONSE</p>
          <h2 id="answerTitle">模型回答</h2>
        </div>
        <button class="icon-button" id="copyButton" type="button"
                aria-label="复制回答" title="复制回答" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>

      <div class="answer-state empty" id="answerState">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>
            <path d="M8 9h8M8 13h5"/>
          </svg>
        </div>
        <p id="emptyText">模型回答将在这里实时显示</p>
      </div>

      <article class="answer-content" id="answerContent" hidden aria-live="polite"></article>

      <footer class="metrics" id="metrics" hidden>
        <div><span>首字延迟</span><strong id="metricTtft">--</strong></div>
        <div><span>总耗时</span><strong id="metricTotal">--</strong></div>
        <div><span>生成速度</span><strong id="metricTps">--</strong></div>
        <div><span>远端请求</span><strong id="metricRemote">--</strong></div>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/web-chat/app.js" defer></script>
</body>
</html>
