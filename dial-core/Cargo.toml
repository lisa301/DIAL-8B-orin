[package]
name = "dial-core"
version = "0.1.0"
edition = "2021"



[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
base64 = "0.22.1"
bitcode = { version = "0.6.0", features = ["serde"] }

clap = { version = "4.5.8", features = ["derive"] }
half = "2.7"
human_bytes = "0.4.3"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
lazy_static = "1.5.0"
libloading = "0.8.9"
log = "0.4.22"
memmap2 = "0.9.4"
memory-stats = "1.2.0"
regex = "1.10.5"
rand = "0.9"
rayon = "1.10"
safetensors = "0.8.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9.34"
tokenizers = { version = "0.22.2", features = ["onig"] }
tokio = { version = "1.38.0", features = ["full"] }
tokio-stream = "0.1.15"
yoke = { version = "0.7.4", features = ["derive"] }

actix-web = { version = "4.8.0", optional = true }
uuid = { version = "1.10.0", optional = true, features = ["v4"] }

candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }
rknpu2 = { version = "0.0.8", features = ["rk3576", "libloading"] }

[features]
default = ["master"]

metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

master = ["dep:actix-web", "dep:uuid"]
